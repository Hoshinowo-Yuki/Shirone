name: Deploy to Production Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ content-updated ]  # Must match event-type from trigger

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      CONTENT_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.sha }}
    defaults:
      run:
        working-directory: /prod-storage/srv/blog/Shirone
    steps:
      - name: SSH Pre-Test
        run: |
          whoami
          ssh -T git@github.com:Hoshinowo-Yuki/moe-mizuki.git || true

      - name: Pull latest changes
        run: |
          git fetch origin main
          git reset --hard origin/main
          git submodule update --init --recursive

      - name: Build and start site
        id: build
        run: |
          set -Eeuo pipefail
          docker compose build
          docker compose up -d --no-build

      - name: Notify success
        if: success()
        run: |
          echo "::notice title=Deployment succeeded::The site was rebuilt and started successfully."
          echo "Deployment succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error title=Deployment failed::The site build or startup failed."
          docker compose ps || true
          docker compose logs --tail=100 || true
          echo "Deployment failed. Check the logs above." >> "$GITHUB_STEP_SUMMARY"
          exit 1